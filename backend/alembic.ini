# Alembic configuration for PaySetu (T1.2; DATABASE.md Section 8).
#
# There is deliberately no sqlalchemy.url here. env.py takes the URL from an explicit
# override (tests) or from validated settings (DATABASE_URL via app/config.py), so no
# credentials are ever committed. Run commands from the backend/ directory (see README).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Migration files: YYYYMMDD_HHMM_<slug>.py (DATABASE.md Section 8), timestamps in UTC.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
