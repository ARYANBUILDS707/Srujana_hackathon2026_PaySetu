# Tool configuration only. Dependencies are pinned in requirements*.txt (ADR-011).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
# The local alembic/ directory holds migrations; `alembic` imports are the installed package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["^\\.venv/"]

# Branch coverage gate for the pure legal/integrity core (AGENTS.md Section 11). Enforced by
# `make test`; no exclusions are configured, so every line and branch must be exercised.
[tool.coverage.run]
branch = true
source = ["app/domain"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
